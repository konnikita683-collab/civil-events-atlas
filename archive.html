<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Исторический гуманитарный архив</title><style>*{box-sizing:border-box}body{margin:0;background:#091725;color:#e5eff9;font:15px/1.5 system-ui}header,main{max-width:1050px;margin:auto;padding:20px}h1{font-size:24px}h2{font-size:18px}article,section{background:#102332;border:1px solid #314d63;border-radius:10px;padding:16px;margin-bottom:12px}select,button{background:#172e42;color:inherit;padding:10px;border:1px solid #47617a;border-radius:6px;font:inherit;max-width:100%}label{display:inline-flex;flex-direction:column;margin:4px 10px 8px 0}a{color:#93c7ff;overflow-wrap:anywhere}.muted{color:#a6b9ca}</style></head><body><header><h1>Исторический гуманитарный архив</h1><p class="muted">Выборка 2024–2025 годов · не реестр атак и не ежедневная сводка</p></header><main><section id="filters"><label>Месяц<select id="p"></select></label><label>Регион<select id="r"></select></label><label>Категория<select id="c"></select></label><button id="reset">Сбросить</button><p id="count" role="status"></p></section><div id="rows"></div><p class="muted">Отсутствие записей не означает отсутствия событий. Автоматический сбор не подключён.</p></main><script type="application/json" id="data">[["2024-03","Белгородская область","Эвакуация","Объявлен план вывоза детей","Губернатор сообщил о намерении организовать вывоз примерно 9 тыс. детей. Reuters и AP передают одно заявление, а не независимые подтверждения выполнения плана.","Заявленный план",[["Reuters · 19.03.2024","https://www.reuters.com/world/europe/around-9000-children-be-evacuated-russias-belgorod-due-ukrainian-shelling-2024-03-19/"],["Associated Press · 19.03.2024","https://apnews.com/article/029e64bdb0d9ba2c8a13dc0854aa7ca4"]]],["2024-08","Курская область","Гуманитарная помощь","Помощь временно переселённым жителям","МЧС сообщало об организации временного проживания, предоставлении предметов первой необходимости, медицинских, психологических и юридических консультаций. Независимая проверка объёма помощи не проводилась.","Официальное сообщение",[["МЧС России · 31.08.2024","https://en.mchs.gov.ru/for-mass-media/novosti/5354284"]]],["2024-11","Курская область","Воссоединение семей","Возвращение гражданских лиц","МККК сообщил об участии в гуманитарной операции по возвращению 46 гражданских лиц из числа жителей Курской области.","Отчёт участника",[["МККК · ретроспективный отчёт","https://www.icrc.org/en/article/russia-icrcs-response-emergency-situation-kursk-linked-hostilities"]]],["2025-03","Курская область","Воссоединение семей","Продолжение гуманитарного возвращения","По отчёту МККК, две операции возвращения суммарно охватили 58 человек (33 и 25). Это не показатель количества атак или пострадавших.","Отчёт участника",[["МККК · ретроспективный отчёт","https://www.icrc.org/en/article/russia-icrcs-response-emergency-situation-kursk-linked-hostilities"]]]]</script><script>"use strict";const data=JSON.parse(document.getElementById("data").textContent),ids=["p","r","c"],$=id=>document.getElementById(id);function node(t,s){const e=document.createElement(t);e.textContent=s;return e}ids.forEach((id,i)=>{const sel=$(id);sel.add(new Option("Все",""));[...new Set(data.map(x=>x[i]))].sort().forEach(v=>sel.add(new Option(v,v)));sel.onchange=render});function render(){const out=data.filter(row=>ids.every((id,i)=>!$(id).value||row[i]===$(id).value));$("count").textContent="Записей: "+out.length+" из "+data.length;$("rows").replaceChildren();if(!out.length){$("rows").append(node("article","В этой выборке нет подходящих записей."));return}out.sort((a,b)=>b[0].localeCompare(a[0])).forEach(row=>{const a=document.createElement("article");a.append(node("small",row[1]+" · "+row[0]+" · "+row[2]),node("h2",row[3]),node("p",row[4]),node("p",row[5]));const ul=document.createElement("ul");row[6].forEach(([n,u])=>{const li=document.createElement("li"),link=node("a",n);link.href=u;link.target="_blank";link.rel="noopener noreferrer";li.append(link);ul.append(li)});a.append(ul);$("rows").append(a)})}$("reset").onclick=()=>{ids.forEach(id=>$(id).value="");render()};render();</script></body></html>
